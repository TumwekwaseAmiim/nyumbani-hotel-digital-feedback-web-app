<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Staff Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<main class="page-shell">

    <section class="card login-card">

        <img
            src="../assets/logo.png"
            class="hotel-logo form-logo"
            alt="Nyumbani Hotel"
        >

        <h1 id="loginTitle">
            Staff Login
        </h1>

        <p
            id="roleText"
            class="role-badge"
        ></p>

        <form id="loginForm">

            <label>
                Email

                <input
                    type="email"
                    id="loginEmail"
                    autocomplete="email"
                    required
                >
            </label>


            <label>
                Password

                <input
                    type="password"
                    id="loginPassword"
                    autocomplete="current-password"
                    required
                >
            </label>


            <button
                class="primary-btn wide-btn"
                type="submit"
            >
                Login
            </button>


            <p
                id="loginMessage"
                class="form-message"
            ></p>

        </form>


        <a
            class="back-link"
            href="../index.html"
        >
            ← Guest Feedback
        </a>

    </section>

</main>


<!-- SUPABASE JAVASCRIPT LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- NYUMBANI HOTEL SUPABASE CONNECTION -->
<script src="../js/supabase.js"></script>


<!-- REAL STAFF AUTHENTICATION -->
<script src="../js/auth.js"></script>


</body>

</html>
